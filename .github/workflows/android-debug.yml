name: Lee T Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'public/app/**'
      - 'public/brand/**'
      - 'src/**'
      - 'migrations/**'
      - 'tests/helpers/database.mjs'
      - 'package-lock.json'
      - 'tests/commercial-android-launcher.test.mjs'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'public/brand/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_NATIVE_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: warehouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test pairing and launcher
        run: node --test tests/commercial-mobile-pairing.test.mjs tests/commercial-android-launcher.test.mjs
      - name: Install locked warehouse dependencies
        run: npm ci --ignore-scripts
      - name: Exercise pinned transport against the warehouse API
        run: node mobile/test-identity-probe.mjs --warehouse
      - name: Generate Android project
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run android:prepare
      - name: Build and verify debug APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='my.leet.warehouse'"
      - uses: actions/upload-artifact@v4
        with:
          name: Lee-T-Mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
