name: LEE T Warehouse Android acceptance

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/brand-artwork.mjs'
      - 'public/app/**'
      - 'public/brand/**'
      - 'src/**'
      - 'migrations/**'
      - 'tests/helpers/database.mjs'
      - 'package-lock.json'
      - 'tests/commercial-android-launcher.test.mjs'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/brand-artwork.mjs'
      - 'public/brand/**'
      - 'public/app/**'
      - 'tests/commercial-mobile*.test.mjs'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_NATIVE_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: warehouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test pairing and launcher
        run: node --test tests/commercial-mobile-pairing.test.mjs tests/commercial-android-launcher.test.mjs
      - name: Install locked warehouse dependencies
        run: npm ci --ignore-scripts
      - name: Exercise pinned transport against the warehouse API
        run: node mobile/test-identity-probe.mjs --warehouse
      - name: Generate Android project
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run android:prepare
      - name: Build and verify debug APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='my.leet.warehouse'"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the packaged app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: node mobile/run-emulator-tests.mjs
      - name: Build the actual release variant for acceptance
        env:
          LEET_ACCEPTANCE_KEYSTORE: ${{ runner.temp }}/leet-acceptance.p12
        run: |
          keytool -genkeypair -keystore "$LEET_ACCEPTANCE_KEYSTORE" -storetype PKCS12 -storepass acceptance-only -keypass acceptance-only -alias acceptance -keyalg RSA -keysize 3072 -validity 2 -dname "CN=Acceptance Only"
          node mobile/prepare-release-acceptance.mjs
          cd mobile/android
          ./gradlew --no-daemon assembleRelease assembleReleaseAndroidTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q application-debuggable; then
            echo 'Release APK must not be debuggable'; exit 1
          fi
      - name: Test all warehouse workflows in the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: node mobile/run-emulator-tests.mjs --release
      - name: Stage the accepted release for private publisher signing
        run: |
          mkdir -p "$RUNNER_TEMP/leet-release-signing"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/leet-release-signing/LEE-T-Warehouse-acceptance-only.apk"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$RUNNER_TEMP/leet-release-signing/apksigner.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-Warehouse-release-for-private-signing
          path: ${{ runner.temp }}/leet-release-signing/*
          if-no-files-found: error
      - name: Retain Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lee-T-Mobile-Android-test-reports
          path: mobile/android/app/build/reports/androidTests/
          if-no-files-found: error
      - name: Name the accepted test APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/LEE-T-Warehouse-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-Warehouse-0.8.5-debug-acceptance
          path: mobile/android/app/build/outputs/apk/debug/LEE-T-Warehouse-debug.apk
          if-no-files-found: error
