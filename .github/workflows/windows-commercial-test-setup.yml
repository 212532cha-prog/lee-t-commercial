name: Lee T Windows test setup

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/start-*.mjs'
      - 'scripts/test-native-runtime.mjs'
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/verify-ruoyi-bundle.mjs'
      - 'installer/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-commercial-test-setup.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/start-*.mjs'
      - 'scripts/test-native-runtime.mjs'
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/verify-ruoyi-bundle.mjs'
      - 'installer/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-commercial-test-setup.yml'
  workflow_dispatch:
    inputs:
      online_qa_profile:
        description: 'Public installer-profile.json from the isolated online QA issuer'
        type: string
        required: false

# A new commit supersedes older checks on the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  management-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash integrations/ruoyi-vue3/build.sh "${{ runner.temp }}/ruoyi-admin"
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-bundled-management
          path: ${{ runner.temp }}/ruoyi-admin
          if-no-files-found: error
  setup:
    needs: management-bundle
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: LEE-T-bundled-management
          path: ${{ runner.temp }}/ruoyi-admin
      - name: Install desktop integration test dependencies
        run: npm ci --ignore-scripts
      - name: Publish self-contained desktop client
        shell: powershell
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP 'leet-desktop'
          dotnet publish desktop/windows/LeeT.Desktop.csproj -c Release -r win-x64 --self-contained true -o $desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop client build failed.' }
          $ProgressPreference = 'SilentlyContinue'
          $webView = Join-Path $env:RUNNER_TEMP 'WebView2RuntimeInstaller.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $webView -UseBasicParsing
      - name: Stage bundled Windows dependencies
        shell: powershell
        run: |
          $nodeDirectory = Split-Path (Get-Command node.exe).Source
          $postgresDirectory = Join-Path $env:ProgramFiles 'PostgreSQL\17'
          ./scripts/windows/Stage-CommercialPayload.ps1 -NodeDirectory $nodeDirectory -PostgresDirectory $postgresDirectory -DesktopDirectory (Join-Path $env:RUNNER_TEMP 'leet-desktop') -WebView2Installer (Join-Path $env:RUNNER_TEMP 'WebView2RuntimeInstaller.exe') -ManagementDirectory (Join-Path $env:RUNNER_TEMP 'ruoyi-admin') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - name: Verify staged desktop runtime
        shell: powershell
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          $desktop = Join-Path $payload 'desktop\LeeT.Warehouse.exe'
          $runtime = Join-Path $payload 'runtime\WebView2RuntimeInstaller.exe'
          $probe = Start-Process -FilePath $desktop -ArgumentList '--check-runtime' -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            $setup = Start-Process -FilePath $runtime -ArgumentList '/silent /install' -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw 'WebView2 setup failed.' }
            $probe = Start-Process -FilePath $desktop -ArgumentList '--check-runtime' -Wait -PassThru
          }
          if ($probe.ExitCode -ne 0) { throw 'Staged desktop cannot locate WebView2.' }
      - name: Verify graphical setup prompts
        shell: powershell
        run: ./scripts/windows/Test-SetupDialogs.ps1
      - name: Verify the desktop window and session
        shell: powershell
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'leet-desktop-tests'
          dotnet publish desktop/tests/LeeT.Desktop.Smoke.csproj -c Release -r win-x64 --self-contained true -o $tests
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test build failed.' }
          ./scripts/windows/Test-Desktop.ps1 -DesktopTestExecutable (Join-Path $tests 'LeeT.Desktop.Smoke.exe') -ActivationPayloadDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - name: Verify real built management in the Windows app with PostgreSQL
        shell: powershell
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'leet-desktop-tests'
          $management = Join-Path $env:RUNNER_TEMP 'leet-payload\app\management'
          ./scripts/windows/Test-Desktop.ps1 -DesktopTestExecutable (Join-Path $tests 'LeeT.Desktop.Smoke.exe') -ManagementDirectory $management -ActivationPayloadDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-native-activation-preview
          path: ${{ runner.temp }}/leet-activation-preview/*.png
          if-no-files-found: error
      - name: Build Windows test setup
        shell: powershell
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $output = Join-Path $env:RUNNER_TEMP 'leet-setup'
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          & $compiler "/DPayloadDir=$payload" "/DBuildOutput=$output" 'installer/windows/LeeT-Test-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Join-Path $output 'LeeT-Test-Setup.exe'
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'Setup executable was not produced.' }
          Get-FileHash -Algorithm SHA256 $setup
      - uses: actions/upload-artifact@v4
        with:
          name: LeeT-Test-Setup
          path: ${{ runner.temp }}/leet-setup/LeeT-Test-Setup.exe
          if-no-files-found: error
      - name: Verify isolated issuer provisioning and trusted HTTPS on Windows
        shell: powershell
        run: |
          $node = (Get-Command node.exe).Source
          $postgres = Join-Path $env:ProgramFiles 'PostgreSQL\17'
          $root = Join-Path $env:ProgramData 'Lee T Online Activation QA'
          $issuer = $null
          ./scripts/windows/Initialize-OnlineActivationQa.ps1 -NodePath $node -PostgresDirectory $postgres -Address '127.0.0.1'
          $env:LEE_T_ACTIVATION_SERVICE_CONFIG = Join-Path $root 'service.private.json'
          $settings = Get-Content -LiteralPath $env:LEE_T_ACTIVATION_SERVICE_CONFIG -Raw | ConvertFrom-Json
          try {
            $stdout = Join-Path $root 'stdout.log'
            $issuer = Start-Process -FilePath $node -ArgumentList 'scripts/start-activation-service.mjs' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError (Join-Path $root 'stderr.log')
            $ready = $false
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if ($issuer.HasExited) { throw 'The isolated issuer exited before readiness.' }
              if ((Get-Content -LiteralPath $stdout -Raw) -match 'activation service ready') { $ready = $true; break }
              Start-Sleep -Milliseconds 150
            }
            if (-not $ready) { throw 'The isolated issuer did not start.' }
            $env:NODE_EXTRA_CA_CERTS = Join-Path $root 'activation-ca.pem'
            & $node --input-type=module -e 'const response=await fetch(process.argv[1]);if(response.status!==405)process.exitCode=1;' -- 'https://127.0.0.1:8445/v1/activation/redeem'
            if ($LASTEXITCODE -ne 0) { throw 'The Windows PFX issuer failed its HTTPS trust probe.' }
            Copy-Item -LiteralPath (Join-Path $root 'installer-profile.json') -Destination (Join-Path $env:RUNNER_TEMP 'leet-online-fixture-profile.json')
          } finally {
            if ($issuer -and -not $issuer.HasExited) { Stop-Process -Id $issuer.Id -Force; $issuer.WaitForExit() }
            Stop-Service -Name $settings.databaseServiceName
            & (Join-Path $postgres 'bin\pg_ctl.exe') unregister -N $settings.databaseServiceName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The isolated PostgreSQL service could not be removed.' }
            Remove-Item -LiteralPath $root -Recurse -Force
          }
      - name: Compile Windows setup with embedded online activation settings
        shell: powershell
        env:
          LEE_T_ONLINE_QA_PROFILE: ${{ inputs.online_qa_profile }}
        run: |
          if (-not $env:LEE_T_ONLINE_QA_PROFILE) {
            $env:LEE_T_ONLINE_QA_PROFILE = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'leet-online-fixture-profile.json') -Raw
          }
          $profile = Join-Path $env:RUNNER_TEMP 'leet-online-public-profile'
          node scripts/prepare-online-qa-profile.mjs $profile
          if ($LASTEXITCODE -ne 0) { throw 'The online QA build profile is invalid.' }
          $settings = Get-Content -LiteralPath (Join-Path $profile 'build.json') -Raw | ConvertFrom-Json
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          $output = Join-Path $env:RUNNER_TEMP 'leet-online-qa'
          $publicKey = Join-Path $profile 'issuer-public.pem'
          $caPath = Join-Path $profile 'activation-ca.pem'
          & $compiler "/DPayloadDir=$payload" "/DBuildOutput=$output" "/DOnlineIssuerPublicKey=$publicKey" "/DOnlineActivationCa=$caPath" "/DOnlineIssuerKeyId=$($settings.issuerKeyId)" "/DOnlineActivationEndpoint=$($settings.endpoint)" 'installer/windows/LeeT-Test-Setup.iss'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $output 'LeeT-Test-Setup.exe') -PathType Leaf)) {
            throw 'Windows setup with embedded activation settings failed to compile.'
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.online_qa_profile != ''
        with:
          name: LeeT-Online-QA-Setup
          path: ${{ runner.temp }}/leet-online-qa/LeeT-Test-Setup.exe
          if-no-files-found: error
