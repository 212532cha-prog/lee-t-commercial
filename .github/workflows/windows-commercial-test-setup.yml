name: Lee T Windows test setup

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/start-*.mjs'
      - 'scripts/test-native-runtime.mjs'
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/verify-ruoyi-bundle.mjs'
      - 'installer/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-commercial-test-setup.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/start-*.mjs'
      - 'scripts/test-native-runtime.mjs'
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/verify-ruoyi-bundle.mjs'
      - 'installer/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-commercial-test-setup.yml'
  workflow_dispatch:
    inputs:
      offline_issuer_key_id:
        description: 'Publisher key ID for the offline installer'
        required: false
        type: string
      offline_issuer_public_key:
        description: 'Ed25519 SPKI PUBLIC KEY base64 only. Keep the signing private key on the issuer computer.'
        required: false
        type: string

# A new commit supersedes older checks on the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  management-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash integrations/ruoyi-vue3/build.sh "${{ runner.temp }}/ruoyi-admin"
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-bundled-management
          path: ${{ runner.temp }}/ruoyi-admin
          if-no-files-found: error
  setup:
    needs: management-bundle
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Provision native PostgreSQL 17 for acceptance
        shell: powershell
        run: ./scripts/windows/Prepare-CiPostgres.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: LEE-T-bundled-management
          path: ${{ runner.temp }}/ruoyi-admin
      - name: Install desktop integration test dependencies
        run: npm ci --ignore-scripts
      - name: Publish self-contained desktop client
        shell: powershell
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP 'leet-desktop'
          dotnet publish desktop/windows/LeeT.Desktop.csproj -c Release -r win-x64 --self-contained true -o $desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop client build failed.' }
          $ProgressPreference = 'SilentlyContinue'
          $webView = Join-Path $env:RUNNER_TEMP 'WebView2RuntimeInstaller.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $webView -UseBasicParsing
      - name: Stage bundled Windows dependencies
        shell: powershell
        run: |
          $nodeDirectory = Split-Path (Get-Command node.exe).Source
          $postgresDirectory = Join-Path $env:ProgramFiles 'PostgreSQL\17'
          ./scripts/windows/Stage-CommercialPayload.ps1 -NodeDirectory $nodeDirectory -PostgresDirectory $postgresDirectory -DesktopDirectory (Join-Path $env:RUNNER_TEMP 'leet-desktop') -WebView2Installer (Join-Path $env:RUNNER_TEMP 'WebView2RuntimeInstaller.exe') -ManagementDirectory (Join-Path $env:RUNNER_TEMP 'ruoyi-admin') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - name: Verify staged desktop runtime
        shell: powershell
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          $desktop = Join-Path $payload 'desktop\LeeT.Warehouse.exe'
          $runtime = Join-Path $payload 'runtime\WebView2RuntimeInstaller.exe'
          $probe = Start-Process -FilePath $desktop -ArgumentList '--check-runtime' -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            $setup = Start-Process -FilePath $runtime -ArgumentList '/silent /install' -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw 'WebView2 setup failed.' }
            $probe = Start-Process -FilePath $desktop -ArgumentList '--check-runtime' -Wait -PassThru
          }
          if ($probe.ExitCode -ne 0) { throw 'Staged desktop cannot locate WebView2.' }
      - name: Verify graphical setup prompts
        shell: powershell
        run: ./scripts/windows/Test-SetupDialogs.ps1
      - name: Verify the desktop window and session
        shell: powershell
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'leet-desktop-tests'
          dotnet publish desktop/tests/LeeT.Desktop.Smoke.csproj -c Release -r win-x64 --self-contained true -o $tests
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test build failed.' }
          ./scripts/windows/Test-Desktop.ps1 -DesktopTestExecutable (Join-Path $tests 'LeeT.Desktop.Smoke.exe') -ActivationPayloadDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - name: Verify real built management in the Windows app with PostgreSQL
        shell: powershell
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'leet-desktop-tests'
          $management = Join-Path $env:RUNNER_TEMP 'leet-payload\app\management'
          ./scripts/windows/Test-Desktop.ps1 -DesktopTestExecutable (Join-Path $tests 'LeeT.Desktop.Smoke.exe') -ManagementDirectory $management -ActivationPayloadDirectory (Join-Path $env:RUNNER_TEMP 'leet-payload')
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-native-activation-preview
          path: ${{ runner.temp }}/leet-activation-preview/*.png
          if-no-files-found: error
      - name: Build Windows test setup
        shell: powershell
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $output = Join-Path $env:RUNNER_TEMP 'leet-setup'
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          & $compiler "/DPayloadDir=$payload" "/DBuildOutput=$output" 'installer/windows/LeeT-Test-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Join-Path $output 'LeeT-Test-Setup.exe'
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'Setup executable was not produced.' }
          Get-FileHash -Algorithm SHA256 $setup
      - uses: actions/upload-artifact@v4
        with:
          name: LeeT-Test-Setup
          path: ${{ runner.temp }}/leet-setup/LeeT-Test-Setup.exe
          if-no-files-found: error
      - name: Build setup with the bundled offline issuer
        shell: powershell
        env:
          LEE_T_OFFLINE_ISSUER_KEY_ID: ${{ inputs.offline_issuer_key_id }}
          LEE_T_OFFLINE_ISSUER_PUBLIC_KEY: ${{ inputs.offline_issuer_public_key }}
        run: |
          if (-not $env:LEE_T_OFFLINE_ISSUER_KEY_ID -and -not $env:LEE_T_OFFLINE_ISSUER_PUBLIC_KEY) {
            $env:LEE_T_OFFLINE_ISSUER_KEY_ID = 'ci-offline-fixture'
            $env:LEE_T_OFFLINE_ISSUER_PUBLIC_KEY = node --input-type=module -e 'import {generateKeyPairSync} from ''node:crypto'';console.log(generateKeyPairSync(''ed25519'').publicKey.export({format:''der'',type:''spki''}).toString(''base64''));'
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the build fixture public key.' }
          }
          $issuer = Join-Path $env:RUNNER_TEMP 'leet-offline-issuer'
          New-Item -ItemType Directory -Path $issuer | Out-Null
          node scripts/windows/prepare-offline-issuer.mjs $issuer
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the offline installer public key.' }
          $key = Join-Path $issuer 'issuer-public.pem'
          $keyId = Get-Content -LiteralPath (Join-Path $issuer 'issuer-id.txt') -Raw
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          $output = Join-Path $env:RUNNER_TEMP 'leet-offline'
          & $compiler "/DPayloadDir=$payload" "/DBuildOutput=$output" "/DOfflineIssuerPublicKey=$key" "/DOfflineIssuerKeyId=$keyId" 'installer/windows/LeeT-Test-Setup.iss'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $output 'LeeT-Offline-Setup.exe') -PathType Leaf)) {
            throw 'Offline setup compilation failed.'
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.offline_issuer_key_id != '' && inputs.offline_issuer_public_key != ''
        with:
          name: LeeT-Offline-Setup
          path: ${{ runner.temp }}/leet-offline/LeeT-Offline-Setup.exe
          if-no-files-found: error
      - name: Build the branded LEE T Warehouse installer
        shell: powershell
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $payload = Join-Path $env:RUNNER_TEMP 'leet-payload'
          $output = Join-Path $env:RUNNER_TEMP 'leet-commercial-rc'
          $publisher = Get-Content 'installer/windows/publisher.json' -Raw | ConvertFrom-Json
          $env:LEE_T_OFFLINE_ISSUER_KEY_ID = $publisher.keyId
          $env:LEE_T_OFFLINE_ISSUER_PUBLIC_KEY = $publisher.publicKeySpkiBase64
          $issuer = Join-Path $env:RUNNER_TEMP 'leet-commercial-publisher'
          New-Item -ItemType Directory -Path $issuer | Out-Null
          node scripts/windows/prepare-offline-issuer.mjs $issuer
          if ($LASTEXITCODE -ne 0) { throw 'Commercial publisher public configuration failed validation.' }
          $key = Join-Path $issuer 'issuer-public.pem'
          $keyId = $publisher.keyId
          & $compiler "/DPayloadDir=$payload" "/DBuildOutput=$output" "/DOfflineIssuerPublicKey=$key" "/DOfflineIssuerKeyId=$keyId" 'installer/windows/LeeT-Commercial-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'LEE T Warehouse installer compilation failed.' }
          $setup = Join-Path $output 'LEE-T-Warehouse-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'LEE T Warehouse installer was not produced.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $output 'SHA256SUMS.txt'), ($hash + '  ' + (Split-Path $setup -Leaf) + "`n"), [Text.UTF8Encoding]::new($false))
          Copy-Item 'docs/commercial/INSTALL.md' (Join-Path $output 'INSTALL.md')
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-Warehouse-0.8.5-Windows
          path: ${{ runner.temp }}/leet-commercial-rc/*
          if-no-files-found: error
