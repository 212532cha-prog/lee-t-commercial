name: LEE T RuoYi management UI

on:
  pull_request:
    paths:
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/test-ruoyi-products.mjs'
      - 'scripts/test-ruoyi-team.mjs'
      - 'scripts/test-ruoyi-inventory.mjs'
      - 'scripts/test-ruoyi-count.mjs'
      - 'scripts/test-ruoyi-costs.mjs'
      - 'scripts/test-ruoyi-exports.mjs'
      - 'scripts/test-ruoyi-profile.mjs'
      - 'scripts/test-ruoyi-backups.mjs'
      - 'scripts/test-ruoyi-product-assets.mjs'
      - 'src/auth/**'
      - 'src/catalog/**'
      - 'src/stock/**'
      - 'src/count/**'
      - 'src/export/**'
      - 'src/profile/**'
      - 'src/backup/**'
      - 'scripts/inspect-xlsx.py'
      - 'tests/helpers/product-workbook.mjs'
      - 'src/dashboard/**'
      - 'tests/ruoyi-*.test.mjs'
      - '.github/workflows/ruoyi-admin.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/ruoyi-vue3/**'
      - 'scripts/test-ruoyi-products.mjs'
      - 'scripts/test-ruoyi-team.mjs'
      - 'scripts/test-ruoyi-inventory.mjs'
      - 'scripts/test-ruoyi-count.mjs'
      - 'scripts/test-ruoyi-costs.mjs'
      - 'scripts/test-ruoyi-exports.mjs'
      - 'scripts/test-ruoyi-profile.mjs'
      - 'scripts/test-ruoyi-backups.mjs'
      - 'scripts/test-ruoyi-product-assets.mjs'
      - 'src/auth/**'
      - 'src/catalog/**'
      - 'src/stock/**'
      - 'src/count/**'
      - 'src/export/**'
      - 'src/profile/**'
      - 'src/backup/**'
      - 'scripts/inspect-xlsx.py'
      - 'tests/helpers/product-workbook.mjs'
      - 'src/dashboard/**'
      - 'tests/ruoyi-*.test.mjs'
      - '.github/workflows/ruoyi-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  management:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_NATIVE_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: warehouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Build the RuoYi management bundle
        run: bash integrations/ruoyi-vue3/build.sh "${{ runner.temp }}/ruoyi-admin"
      - name: Verify built product forms against PostgreSQL
        run: node scripts/test-ruoyi-products.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify employee and device workflows against PostgreSQL
        run: node scripts/test-ruoyi-team.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify inventory history and quantity recovery against PostgreSQL
        run: node scripts/test-ruoyi-inventory.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify stocktake management and direct sign-in against PostgreSQL
        run: node scripts/test-ruoyi-count.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify costs and reminder crossing protection against PostgreSQL
        run: node scripts/test-ruoyi-costs.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify parsed Excel and PDF downloads against PostgreSQL
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          node scripts/test-ruoyi-exports.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify Administrator profile and password session revocation
        run: node scripts/test-ruoyi-profile.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify backup recovery and restricted navigation
        run: node scripts/test-ruoyi-backups.mjs "${{ runner.temp }}/ruoyi-admin"
      - name: Verify product photos, QR printing and Excel preview imports
        run: node scripts/test-ruoyi-product-assets.mjs "${{ runner.temp }}/ruoyi-admin"
      - uses: actions/upload-artifact@v4
        with:
          name: LEE-T-RuoYi-management-candidate
          path: ${{ runner.temp }}/ruoyi-admin
          if-no-files-found: error
